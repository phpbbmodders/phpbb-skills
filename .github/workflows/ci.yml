name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Skill checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Skill front matter, links and scripts
        run: python3 -B tools/check-skills.py

      - name: Reference document hashes
        run: python3 -B phpbb-accessible-controls/scripts/verify_references.py

      - name: ShellCheck
        run: shellcheck tools/route-test.sh
